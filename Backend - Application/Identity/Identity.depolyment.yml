apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namesapace: Backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: identity-service
  strategy:
    type: RollingUpdate  
    rollingUpdate:
      maxSurge: 25%        
      maxUnavailable: 25%    
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
      - name: identity-service
        image: your-docker-registry/identity-service:latest
        imagePullPolicy: IfNotPresent  
        imagePullSecrets:
        - name: my_registry_secret  
        ports:
        - containerPort: 3001
        env:
        - name: MONGODB_URI 
          value: "mongodb://root:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017" 
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /healthz         
            port: 3001
          initialDelaySeconds: 10   
          failureThreshold: 3   
          timeoutSeconds: 20    
          periodSeconds: 10          
        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /Ready        
            port: 3001
          initialDelaySeconds: 10   
          failureThreshold: 3   
          timeoutSeconds: 20    
          periodSeconds: 10          





