---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: Backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-identity
  template:
    metadata:
      labels:
        app: mongodb-identity
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "root"  
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret   
                  key: password
          volumeMounts:
            - mountPath: /data/db         
              name: mongodb-storage

      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: identity-pvc        