apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring  # Change to your preferred namespace
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      containers:
        - name: node-exporter
          image: prom/node-exporter:latest
          ports:
            - containerPort: 9090
              name: metrics
          volumeMounts:
            - name: prometheus-config 
              mountPath: /etc/prometheus/
          args :
            - "--config.file=/etc/prometheus/prometheus.yml" 

      volumes :
        - name : prometheus-config 
          configMap :
            name : prometheus-config 
        