---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-reader-binding
subjects:
  - kind: ServiceAccount
    name: my-service-account  # Name of the ServiceAccount
    namespace: Frontend      # Namespace where the ServiceAccount resides
roleRef:
  kind: ClusterRole
  name: pod-reader           # Name of the ClusterRole being referenced
  apiGroup: rbac.authorization.k8s.io
